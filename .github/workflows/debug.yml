name: Debug build and tests

on:
  pull_request:
  push:
    branches:
      - feature/floating-lockscreen-audio
      - refactor/main-selected-floating
      - main
      - restart/main-clean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu image already includes sdkmanager. The setup-android
      # action currently tries to install the removed legacy 'tools' package.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "platform-tools"
      - name: Test and build Debug APK only
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --build-cache --no-daemon --stacktrace
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextep-panes-four-slot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
