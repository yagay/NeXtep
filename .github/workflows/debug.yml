name: Debug build and tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1" "platform-tools"
      - name: Test and build Debug APK only
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --build-cache --no-daemon --stacktrace
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextep-panes-four-slot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
